name: Container image

# Publishes the server image to GitHub Container Registry when a release is
# published. `workflow_dispatch` is the way to exercise the same build before a
# release exists (or to re-publish one by hand) — it builds and smoke-tests by
# default and only pushes when you tick `push`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (unchecked = build and smoke-test only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # The image links libtorch, so a cold build compiles the full dependency
    # tree and then copies a few hundred MB of shared objects around.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # A cold build holds the Rust base image, the cargo registry, the fetched
      # libtorch, `target/` and the bundled dist all at once, which will fill a
      # stock runner's disk. Dropping the preinstalled toolchains we don't use
      # buys ~25 GB; if this build ever dies with a cryptic I/O error, disk is
      # the first thing to check.
      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is opt-in below so a prerelease can never claim it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=ref,event=branch
            type=sha,format=long

      # Build once into the local daemon so the image can be tested before it is
      # published. Only linux/amd64: an arm64 leg would have to be emulated
      # under QEMU, and a full libtorch link there does not finish in a sane
      # amount of runner time.
      #
      # No `cache-to: type=gha` on purpose — the image is ~3 GB, which would eat
      # most of the repo's 10 GB Actions cache for a build that only runs per
      # release (so the cache would be cold or evicted by then anyway).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail

          # 1. Every shared object the binary needs must resolve from inside the
          #    image. This is precisely what `build.sh --link bundled` (libtorch
          #    beside the binary, rpath $ORIGIN/lib) is there to guarantee, and
          #    it is the failure mode a container hits first.
          missing="$(docker run --rm --entrypoint ldd "$IMAGE" /opt/nereid/grpc-test | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "unresolved shared libraries in the image:"; echo "$missing"; exit 1
          fi
          echo "OK: all shared libraries resolve"

          # 2. The server must actually start and read its config from the
          #    working directory. Pointing ml_backends_path at a missing
          #    directory reaches a known, specific error without having to ship
          #    a model (and its virtualenv) into CI.
          #
          #    This lives in RUNNER_TEMP, not the workspace: a stray file in the
          #    build context would invalidate the `COPY . .` layer and make the
          #    push step rebuild — publishing a different image than the one
          #    tested here.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cat > "$smoke/nereid.yaml" <<'YAML'
          server:
            bind_addr: "[::]:50051"
            ml_backends_path: "/nonexistent"
          models:
            - name: "smoke"
              device: "cpu"
              queue_capacity: 1
          YAML
          out="$(docker run --rm -v "$smoke:/nereid:ro" "$IMAGE" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "failed to resolve server.ml_backends_path" \
            || { echo "server did not reach config validation as expected"; exit 1; }
          echo "OK: server starts and parses its config"

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identical inputs to the build above, on the same buildx instance, so this
      # resolves from that build's cache — what it costs is the push itself.
      - name: Push to GHCR
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
